server {
    listen 80;

    location / {
        root /usr/share/nginx/html/dist;
        try_files $uri $uri/ /index.html;
    }

    location /ofrep/v1/evaluate/flags {
        limit_except POST { deny all; }
        alias /usr/share/nginx/html/static/flags.json;
        error_page 405 =200 /static/flags.json;
    }

    location /stream {
        default_type text/event-stream;
        add_header Cache-Control no-cache;
        alias /usr/share/nginx/html/static/stream.txt;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }
}
